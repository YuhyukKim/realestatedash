name: Check official building API page size
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare supported page sizes without exposing keys
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node scripts/probe-building-page-size.mjs
