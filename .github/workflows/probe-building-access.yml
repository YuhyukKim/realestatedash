name: Check official building API access
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check building endpoints without exposing credentials
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node scripts/check-filtered-prices.mjs
