name: Diagnose official building register connection
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check small official requests without exposing credentials
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN || 'https://seoul-redevelopment-map-yuhyu.whisky88.chatgpt.site' }}
        run: node scripts/probe-building-connection.mjs --prices
