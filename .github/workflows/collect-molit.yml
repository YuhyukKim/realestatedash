name: Collect MOLIT snapshots
on:
  workflow_dispatch:
    inputs:
      districts:
        description: 'Comma-separated Seoul districts (e.g. 마포구,영등포구); explicit scope required'
        required: true
        default: '마포구'
      from:
        description: 'First month YYYYMM (blank = previous month)'
        required: false
      to:
        description: 'Last month YYYYMM (blank = current Seoul month; max 12 months)'
        required: false
      kind:
        description: 'Feed to collect'
        type: choice
        options: [both, sale, rent]
        default: both
permissions:
  contents: read
concurrency:
  group: pages-data-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-pages
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-pages.mjs && npm run test:pages
      - name: Collect to validated public snapshots (key is never persisted)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_DISTRICTS: ${{ inputs.districts }}
          MOLIT_FROM: ${{ inputs.from }}
          MOLIT_TO: ${{ inputs.to }}
          MOLIT_KIND: ${{ inputs.kind || 'both' }}
        run: node scripts/collect-pages.mjs
      - name: Validate complete site before saving any data
        run: npm run build:pages && npm run test:pages
      - name: Save only sanitized public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/scopes
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh validated MOLIT snapshots"
            git push origin HEAD:github-pages
          fi
  publish:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages.yml
