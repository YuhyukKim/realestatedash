name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || vars.CLOUDFLARE_D1_DATABASE_ID }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID MOLIT_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository configuration: $key"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: Configure production DB binding
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          const id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id) || id === '00000000-0000-4000-8000-000000000000') throw new Error('A real Cloudflare D1 database ID is required');
          const db = config.d1_databases?.find(binding => binding.binding === 'DB');
          if (!db) throw new Error('DB binding is missing from the build');
          db.database_id = id;
          db.migrations_dir = '../../drizzle';
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          NODE

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      - name: Configure application keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID || vars.NAVER_MAP_CLIENT_ID }}
        run: |
          printf '%s' "$MOLIT_API_KEY" | npx wrangler secret put MOLIT_API_KEY --config dist/server/wrangler.json
          if [ -n "$NAVER_MAP_CLIENT_ID" ]; then
            printf '%s' "$NAVER_MAP_CLIENT_ID" | npx wrangler secret put NAVER_MAP_CLIENT_ID --config dist/server/wrangler.json
          else
            echo "::warning::NAVER_MAP_CLIENT_ID was not supplied; any existing Worker secret is retained. A new Worker will not have the embedded map."
          fi
