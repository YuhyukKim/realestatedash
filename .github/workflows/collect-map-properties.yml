name: Collect official map building and assessed-price data
on:
  workflow_dispatch:
    inputs:
      year:
        description: '공시연도: 빈 값/recent5=최근 5개년, 2022-2026=기간, all=전체'
        required: false
      project_ids:
        description: '단지 ID를 쉼표로 구분 (빈 값은 전체)'
        required: false
permissions:
  contents: read
concurrency:
  group: pages-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public building and price records
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN || 'https://seoul-redevelopment-map-yuhyu.whisky88.chatgpt.site' }}
          PROPERTY_PRICE_YEAR: ${{ inputs.year }}
          PROPERTY_PROJECT_IDS: ${{ inputs.project_ids }}
          PROPERTY_PRICE_SOURCE: building
          PROPERTY_PUBLISH_CHECKPOINTS: '1'
        run: node scripts/collect-map-property-batches.mjs
      - name: Save sanitized public data
        if: always()
        run: |
          if [ ! -d data/property ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property
          if ! git diff --cached --quiet; then
            git commit -m "Update official map building and assessed-price snapshots"
            git pull --rebase origin main
            git push
          fi

