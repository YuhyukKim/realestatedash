name: Collect official map area types
on:
  workflow_dispatch:
    inputs:
      project_ids:
        description: '단지 ID를 쉼표로 구분'
        default: '377,387,382'
        required: true
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect area metadata from the building register
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MARKET_AREA_PROJECT_IDS: ${{ inputs.project_ids }}
        run: node scripts/collect-map-area-types.mjs
      - name: Save confirmed public area data
        if: always()
        run: |
          if [ ! -d data/market-area-types ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-area-types data/property
          if ! git diff --cached --quiet; then
            git commit -m "Update official area type metadata"
            git pull --rebase origin main
            git push
          fi
