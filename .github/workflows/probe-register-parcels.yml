name: Check official related building parcels
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect only public parcel and building labels
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node scripts/probe-register-parcels.mjs
